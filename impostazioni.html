<div class="settings-shell">
  <div class="card settings-card">
    <h1>⚙️ Impostazioni Profilo</h1>
    <p class="muted">Aggiorna i tuoi dati ACSL</p>

    <div id="settings-error" class="alert" style="display:none;"></div>
    <div id="settings-ok" class="ok" style="display:none;"></div>

    <form id="settings-form" class="settings-form">
      <label>Nome utente</label>
      <input type="text" id="name" placeholder="Inserisci nome utente">

      <label>Foto profilo (URL)</label>
      <input type="url" id="photo" placeholder="https://...">

      <label>Email</label>
      <input type="email" id="email" placeholder="nome@email.com">

      <label>Nuova password</label>
      <input type="password" id="password" placeholder="••••••••">

      <button type="submit" class="btn-primary">💾 Salva modifiche</button>
    </form>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { 
    getAuth, 
    onAuthStateChanged, 
    updateProfile, 
    updateEmail, 
    updatePassword 
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDET0ys2c41Lwl1WklVD2dlT9IsQFbgbns",
    authDomain: "gabrielmatteojoneslogin.firebaseapp.com",
    projectId: "gabrielmatteojoneslogin",
    storageBucket: "gabrielmatteojoneslogin.firebasestorage.app",
    messagingSenderId: "842558884649",
    appId: "1:842558884649:web:f3a895cd546f8165d30538",
    measurementId: "G-VNEYX22DX9"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const $form = document.getElementById("settings-form");
  const $err = document.getElementById("settings-error");
  const $ok = document.getElementById("settings-ok");

  const showError = (msg) => { $err.textContent = msg; $err.style.display = "block"; $ok.style.display="none"; };
  const showOk = (msg) => { $ok.textContent = msg; $ok.style.display = "block"; $err.style.display="none"; };

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "/login/";
    } else {
      document.getElementById("name").value = user.displayName || "";
      document.getElementById("photo").value = user.photoURL || "";
      document.getElementById("email").value = user.email || "";
    }
  });

  $form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const user = auth.currentUser;
    if (!user) return;

    const name = document.getElementById("name").value.trim();
    const photo = document.getElementById("photo").value.trim();
    const email = document.getElementById("email").value.trim();
    const pass = document.getElementById("password").value.trim();

    try {
      // Aggiorna nome e foto
      if (name || photo) {
        await updateProfile(user, { displayName: name || user.displayName, photoURL: photo || user.photoURL });
      }
      // Aggiorna email
      if (email && email !== user.email) {
        await updateEmail(user, email);
      }
      // Aggiorna password
      if (pass) {
        await updatePassword(user, pass);
      }

      showOk("Profilo aggiornato con successo ✅");
    } catch (err) {
      console.error(err);
      showError("Errore: " + err.message);
    }
  });
</script>
