---
layout: page
---
<iframe src="https://ufficiogabrieljones.it/dashboard/admin/" width="100%" height="800" style="border:none;"></iframe>
<ul>
  {% assign docs = site.docs | sort: "title" %}
  {% for doc in docs %}
    <li>
      <h3><a href="{{ doc.permalink }}">{{ doc.title }}</a></h3>
      <p>{{ doc.descrizione }}</p>
      <a href="{{ doc.documento_link }}">Scarica il documento ({{ doc.documento_peso }})</a>
    </li>
  {% endfor %}
</ul>
