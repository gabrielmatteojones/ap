<div id="loading">⏳ Verifica accesso...</div>
<div id="content" style="display:none;">
  {{ content }}
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script>
  // Config Firebase (stesso di user.html)
  const firebaseConfig = {
    apiKey: "AIzaSyA5vs7wXPz3gQlALVRjxJgFYwZmB-ySUGE",
    authDomain: "accentocivico.firebaseapp.com",
    projectId: "accentocivico",
    storageBucket: "accentocivico.firebasestorage.app",
    messagingSenderId: "458977448648",
    appId: "1:458977448648:web:cb08ac1274328356d5cbfd",
    measurementId: "G-HDMW0Y4M6Q",
  };
  firebase.initializeApp(firebaseConfig);

  firebase.auth().onAuthStateChanged(user => {
    const loading = document.getElementById("loading");
    const content = document.getElementById("content");

    if (user) {
      // Se l'utente è sulla pagina di login, mandalo in area personale
      if (window.location.pathname.endsWith("/user.html")) {
        window.location.href = "/area-personale/";
        return;
      }
      loading.style.display = "none";
      content.style.display = "block";
    } else {
      // Se non loggato → vai alla pagina di login
      if (!window.location.pathname.endsWith("/user.html")) {
        window.location.href = "/user.html";
      }
    }
  });
</script>
