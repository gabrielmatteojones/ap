<!doctype html>
<html lang="it" class="no-js" data-theme="system">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title }} · {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
<style>

  :root {
  --bg-light: #f7f7fb;
  --bg-dark: #0b0c0f;
  --text-light: #0b1221;
  --text-dark: #e5e7eb;
  --muted: #6b7280;
  --brand: #10b981;
  --shadow: 0 10px 30px rgba(2,6,23,.08);
  --radius: 16px;
  --transition: 0.25s ease;
}

/* Reset base */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  line-height: 1.6;
  background: var(--bg-light);
  color: var(--text-light);
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }

/* Tema dark */
html.dark body { background: var(--bg-dark); color: var(--text-dark); }
html.dark .btn { background: #111827; border-color: #1f2937; color: #e5e7eb; }
html.dark footer { border-color: #1f2937; }

/* Container */
.container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

/* NAV */
.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 0;
}
.logo {
  display: flex;
  gap: 10px;
  align-items: center;
  font-weight: 700;
}
.logo .mark {
  width: 34px;
  height: 34px;
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(16,185,129,.25), rgba(16,185,129,.7));
  display: grid;
  place-items: center;
  box-shadow: var(--shadow);
}
.logo svg { width: 20px; height: 20px; }

/* Bottoni */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid rgba(2,6,23,.1);
  background: #fff;
  font-weight: 600;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform var(--transition), box-shadow var(--transition);
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.1); }
.btn-ghost { background: transparent; }

/* HERO */
.hero {
  position: relative;
  border-bottom: 1px solid rgba(2,6,23,.06);
  background: linear-gradient(180deg, rgba(16,185,129,.08), transparent 40%);
}
.surface {
  position: absolute;
  inset: 0;
  background: radial-gradient(600px 200px at 20% -10%, rgba(16,185,129,.25), transparent),
              radial-gradient(800px 250px at 80% 0%, rgba(16,185,129,.15), transparent);
  filter: blur(20px);
  opacity: .6;
  pointer-events: none;
}

/* FOOTER */
footer {
  padding: 40px 24px;
  border-top: 1px solid rgba(2,6,23,.1);
  text-align: center;
  color: var(--muted);
  font-size: 14px;
}


  .featured-article {
  margin: 40px 0;
}
.card-media.large img {
  width: 100%;
  height: 320px;
  object-fit: cover;
  border-radius: var(--radius) var(--radius) 0 0;
}
.featured-title {
  font-size: 1.8rem;
  line-height: 1.3;
  margin-top: 10px;
}

</style></head>
<body>
<header class="hero">
  <div class="surface" aria-hidden="true"></div>
  <nav class="nav container" aria-label="Principale">
    <a href="{{ '/' | relative_url }}" class="logo" aria-label="Homepage">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M4 4v15.5"/>
          <path d="M20 4v13"/>
          <path d="M6.5 17A2.5 2.5 0 0 0 4 19.5"/>
        </svg>
      </span>
      <span>{{ site.title }}</span>
    </a>
    <div class="nav-actions" id="auth-actions">
      <button id="themeBtn" class="btn btn-ghost" aria-pressed="false" aria-label="Cambia tema">
        <span id="themeIcon" aria-hidden="true">🌞</span>
        <span class="sr-only">Cambia tema</span>
      </button>
      <!-- I bottoni login/logout saranno gestiti via JS -->
    </div>
  </nav>
</header>
<br>
  <br>
<main class="container">
  {{ content }}
</main>

<footer>
  © {{ "now" | date: "%Y" }} {{ site.title }} · 
  <a href="{{ '/privacy' | relative_url }}">Privacy</a>
</footer>

<script>
  // Tema con localStorage
  (function(){
    const html = document.documentElement;
    const btn = document.getElementById('themeBtn');
    const icon = document.getElementById('themeIcon');
    const saved = localStorage.getItem('theme');
    if(saved === 'light' || saved === 'dark') html.classList.add(saved);
    btn.addEventListener('click', () => {
      const isDark = html.classList.toggle('dark');
      html.classList.remove(isDark ? 'light' : 'dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      icon.textContent = isDark ? '🌙' : '🌞';
      btn.setAttribute('aria-pressed', String(isDark));
    });
    icon.textContent = html.classList.contains('dark') ? '🌙' : '🌞';
  })();
</script>

<!-- Firebase Auth -->
<script type="module">
  // Import SDK Firebase (servono i tuoi config)
  // import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
  // import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
  // const app = initializeApp(firebaseConfig);
  // const auth = getAuth(app);

  const authActions = document.getElementById('auth-actions');

  // Simulazione: rimpiazza con onAuthStateChanged(auth, user => {...})
  const firebaseUser = false; // cambia in true se loggato

  if (firebaseUser) {
    authActions.innerHTML += `
      <a class="btn" href="/area-personale/">Area Personale</a>
      <button class="btn" onclick="firebaseSignOut()">Logout</button>`;
  } else {
    authActions.innerHTML += `<a class="btn" href="/login">Login</a>`;
  }

  function firebaseSignOut(){
    alert("Logout Firebase (qui metti signOut(auth))");
  }
</script>

<!-- Netlify Identity -->
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      const authActions = document.getElementById('auth-actions');
      if (user) {
        authActions.innerHTML += `
          <a class="btn" href="/intranet/">Intranet</a>
          <button class="btn" onclick="window.netlifyIdentity.logout()">Logout</button>`;
      } else {
        authActions.innerHTML += `<a class="btn" href="/login">Login</a>`;
      }
    });
  }
</script>

</body>
</html>
