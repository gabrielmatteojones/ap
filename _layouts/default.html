<!doctype html>
<html lang="it" class="no-js" data-theme="system">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title }} · {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
</head>
<body>
<header class="hero">
  <div class="surface" aria-hidden="true"></div>
  <nav class="nav container" aria-label="Principale">
    <a href="{{ '/' | relative_url }}" class="logo" aria-label="Homepage">
      <span class="mark" aria-hidden="true">
        <!-- icona libro -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M4 4v15.5"/>
          <path d="M20 4v13"/>
          <path d="M6.5 17A2.5 2.5 0 0 0 4 19.5"/>
        </svg>
      </span>
      <span>{{ site.title }}</span>
    </a>
    <div class="nav-actions">
      <button id="themeBtn" class="btn btn-ghost" aria-pressed="false" aria-label="Cambia tema">
        <span id="themeIcon" aria-hidden="true">🌞</span>
        <span class="sr-only">Cambia tema</span>
      </button>
      {% if site.user %}
        <!-- se loggato -->
        <a class="btn" href="/dashboard">Dashboard</a>
        <a class="btn" href="/logout">Logout</a>
      {% else %}
        <!-- se NON loggato -->
        <a class="btn" href="/signup">Registrati</a>
        <a class="btn" href="/login">Login</a>
      {% endif %}
    </div>
  </nav>
</header>

<main class="container">
  {{ content }}
</main>

<footer>
  © {{ "now" | date: "%Y" }} {{ site.title }} · 
  <a href="{{ '/privacy' | relative_url }}">Privacy</a>
</footer>

<script>
  // Tema con localStorage
  (function(){
    const html = document.documentElement;
    const btn = document.getElementById('themeBtn');
    const icon = document.getElementById('themeIcon');
    const saved = localStorage.getItem('theme');
    if(saved === 'light' || saved === 'dark') html.classList.add(saved);
    btn.addEventListener('click', () => {
      const isDark = html.classList.toggle('dark');
      html.classList.remove(isDark ? 'light' : 'dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      icon.textContent = isDark ? '🌙' : '🌞';
      btn.setAttribute('aria-pressed', String(isDark));
    });
    icon.textContent = html.classList.contains('dark') ? '🌙' : '🌞';
  })();
</script>
</body>
</html>
