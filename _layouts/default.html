<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <meta name="author" content="{{ site.author }}" />
  <meta name="robots" content="index, follow" />
  
  <link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}" type="image/x-icon" />
  <link rel="shortcut icon" href="{{ '/assets/favicon.ico' | relative_url }}" type="image/x-icon" />
  
  <!-- USWDS CSS -->
  <link href="https://cdn.jsdelivr.net/npm/uswds@2.14.0/dist/css/uswds.min.css" rel="stylesheet" />
  
  <style>
    body {
      font-family: "Source Sans Pro", Arial, sans-serif;
      background-color: #f9fafb;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: #212121;
    }
    main {
      flex-grow: 1;
      padding: 2rem 1rem;
      max-width: 960px;
      margin: 0 auto;
    }
    footer {
      background-color: #002a5c;
      color: white;
      text-align: center;
      padding: 1.5rem 1rem;
      font-size: 0.9rem;
      margin-top: auto;
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.1);
    }
    /* Navbar logo + text affiancati */
    .usa-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      position: relative;
    }
    .usa-logo__link {
      display: flex;
      align-items: center;
      text-decoration: none;
    }
    .usa-logo__link img {
      height: 48px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgb(0 0 0 / 0.15);
      transition: transform 0.3s ease;
    }
    .usa-logo__link:hover img,
    .usa-logo__link:focus img {
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgb(0 0 0 / 0.25);
    }
    /* Titolo semplice desktop */
    .usa-logo__title-static {
      font-weight: 700;
      font-size: 1.25rem;
      color: #002a5c;
      white-space: nowrap;
      cursor: default;
      border: none;
      background: none;
      padding: 0;
      user-select: none;
      display: inline-block;
    }
    /* Titolo bottone mobile (hidden desktop) */
    .usa-logo__title-button {
      display: none;
      font-weight: 700;
      font-size: 1.25rem;
      color: #002a5c;
      white-space: nowrap;
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
      user-select: none;
      position: relative;
    }
    /* Dropdown menu mobile */
    .dropdown-menu-mobile {
      position: absolute;
      top: 100%;
      left: 0;
      background: white;
      border: 1px solid #d1d5db;
      box-shadow: 0 2px 6px rgb(0 0 0 / 0.15);
      border-radius: 4px;
      min-width: 160px;
      margin-top: 0.25rem;
      z-index: 1000;
      display: none;
      flex-direction: column;
    }
    .dropdown-menu-mobile.show {
      display: flex;
    }
    .dropdown-menu-mobile a {
      padding: 0.5rem 1rem;
      color: #002a5c;
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px solid #e5e7eb;
    }
    .dropdown-menu-mobile a:last-child {
      border-bottom: none;
    }
    .dropdown-menu-mobile a:hover,
    .dropdown-menu-mobile a:focus {
      background-color: #f0f9ff;
      outline: none;
    }
    /* Nascondi titolo bottone mobile da desktop */
    @media (max-width: 767px) {
      .usa-logo__title-static {
        display: none;
      }
      .usa-logo__title-button {
        display: inline-block;
      }
    }
    /* Navbar active link style */
    .usa-nav__link[aria-current="page"] {
      font-weight: 600;
      border-bottom: 3px solid #005ea2;
      color: #005ea2;
    }
    /* Table styling */
    .usa-table--striped tbody tr:nth-child(odd) {
      background-color: #f2f4f7;
    }
    /* Hero image full width */
    .hero-image {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      display: block;
      margin-bottom: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgb(0 0 0 / 0.12);
    }
    /* Search form spacing */
    nav form {
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <header class="usa-header usa-header--basic" role="banner">
    <div class="usa-nav-container">
      <div class="usa-navbar">
        <div class="usa-logo" id="basic-logo">
          <a href="{{ '/' | relative_url }}" class="usa-logo__link" title="Homepage" aria-label="Homepage">
            <img src="{{ '/assets/logo.png' | relative_url }}" alt="{{ site.title }} Logo" />
          </a>
          <!-- Titolo semplice desktop -->
          <span class="usa-logo__title-static">{{ site.title }}</span>
          <!-- Titolo bottone mobile -->
          <button id="titleMobileBtn" class="usa-logo__title-button" aria-haspopup="true" aria-expanded="false" aria-controls="titleMobileMenu">
            {{ site.title }} ▾
          </button>
          <nav id="titleMobileMenu" class="dropdown-menu-mobile" role="menu" aria-label="Menu {{ site.title }}">
            {% for item in site.nav %}
            <a href="{{ item.url | relative_url }}" role="menuitem" {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.name }}</a>
            {% endfor %}
          </nav>
        </div>
        <button class="usa-menu-btn" aria-expanded="false" aria-controls="basic-mobile-menu">Menu</button>
      </div>

      <nav id="basic-mobile-menu" class="usa-nav" role="navigation" aria-label="Primary navigation">
        <ul class="usa-nav__primary usa-accordion">
          {% for item in site.nav %}
          <li class="usa-nav__primary-item">
            <a href="{{ item.url | relative_url }}" class="usa-nav__link" {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.name }}</a>
          </li>
          {% endfor %}
        </ul>
        <form class="usa-search usa-search--small" role="search" action="{{ site.search_action | default: '#' }}" method="get">
          <label class="usa-sr-only" for="search-field">Cerca</label>
          <input
            class="usa-input"
            id="search-field"
            type="search"
            name="search"
            placeholder="Cerca documenti"
            aria-label="Cerca documenti"
          />
          <button class="usa-button usa-button--primary" type="submit" aria-label="Cerca">
            Cerca
          </button>
        </form>
      </nav>
    </div>
  </header>

  <div class="container">
    {{ content }}
  </div>
  
  <footer>
    <div class="grid-container">
      &copy; {{ "now" | date: "%Y" }} {{ site.author }} • Tutti i diritti riservati •
      <a href="{{ '/privacy' | relative_url }}" style="color:#cbd3dc;">Privacy</a> •
      <a href="{{ '/accessibility' | relative_url }}" style="color:#cbd3dc;">Accessibilità</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/uswds@2.14.0/dist/js/uswds.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const btnMobile = document.getElementById("titleMobileBtn");
      const menuMobile = document.getElementById("titleMobileMenu");

      btnMobile.addEventListener("click", () => {
        const expanded = btnMobile.getAttribute("aria-expanded") === "true";
        btnMobile.setAttribute("aria-expanded", String(!expanded));
        menuMobile.classList.toggle("show");
      });

      // Chiudi menu se clicchi fuori (solo su mobile)
      document.addEventListener("click", (event) => {
        if (!btnMobile.contains(event.target) && !menuMobile.contains(event.target)) {
          btnMobile.setAttribute("aria-expanded", "false");
          menuMobile.classList.remove("show");
        }
      });
    });
  </script>
</body>
</html>
