<!doctype html>
<html lang="it" class="no-js" data-theme="system">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title }} · {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
<style>

  :root {
  --bg-light: #f7f7fb;
  --bg-dark: #0b0c0f;
  --text-light: #0b1221;
  --text-dark: #e5e7eb;
  --muted: #6b7280;
  --brand: #10b981;
  --shadow: 0 10px 30px rgba(2,6,23,.08);
  --radius: 16px;
  --transition: 0.25s ease;
}

/* Reset base */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  line-height: 1.6;
  background: var(--bg-light);
  color: var(--text-light);
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }

/* Tema dark */
html.dark body { background: var(--bg-dark); color: var(--text-dark); }
html.dark .btn { background: #111827; border-color: #1f2937; color: #e5e7eb; }
html.dark footer { border-color: #1f2937; }

/* Container */
.container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

/* NAV */
.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 0;
}
.logo {
  display: flex;
  gap: 10px;
  align-items: center;
  font-weight: 700;
}
.logo .mark {
  width: 34px;
  height: 34px;
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(16,185,129,.25), rgba(16,185,129,.7));
  display: grid;
  place-items: center;
  box-shadow: var(--shadow);
}
.logo svg { width: 20px; height: 20px; }

/* Bottoni */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid rgba(2,6,23,.1);
  background: #fff;
  font-weight: 600;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform var(--transition), box-shadow var(--transition);
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.1); }
.btn-ghost { background: transparent; }

/* HERO */
.hero {
  position: relative;
  border-bottom: 1px solid rgba(2,6,23,.06);
  background: linear-gradient(180deg, rgba(16,185,129,.08), transparent 40%);
}
.surface {
  position: absolute;
  inset: 0;
  background: radial-gradient(600px 200px at 20% -10%, rgba(16,185,129,.25), transparent),
              radial-gradient(800px 250px at 80% 0%, rgba(16,185,129,.15), transparent);
  filter: blur(20px);
  opacity: .6;
  pointer-events: none;
}

/* FOOTER */
footer {
  padding: 40px 24px;
  border-top: 1px solid rgba(2,6,23,.1);
  text-align: center;
  color: var(--muted);
  font-size: 14px;
}


  .featured-article {
  margin: 40px 0;
}
.card-media.large img {
  width: 100%;
  height: 320px;
  object-fit: cover;
  border-radius: var(--radius) var(--radius) 0 0;
}
.featured-title {
  font-size: 1.8rem;
  line-height: 1.3;
  margin-top: 10px;
}

</style></head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="{{ '/' | relative_url }}" class="logo-link">
        <img src="/assets/login.png" alt="Gabriel Jones" class="logo">
      </a>

      <nav class="site-nav">
        <ul>
          <li><a href="{{ '/' | relative_url }}">Home</a></li>
          <li><a href="{{ '/articoli/' | relative_url }}">Articoli</a></li>
          <li><a href="{{ '/contatti/' | relative_url }}">Contatti</a></li>
          <li id="nav-login"></li>
        </ul>
      </nav>
    </div>
  </header>

<br>
  <br>
<main class="container">
  {{ content }}
</main>

<footer>
  © {{ "now" | date: "%Y" }} {{ site.title }} · 
  <a href="{{ '/privacy' | relative_url }}">Privacy</a>
</footer>

<script>
  // Tema con localStorage
  (function(){
    const html = document.documentElement;
    const btn = document.getElementById('themeBtn');
    const icon = document.getElementById('themeIcon');
    const saved = localStorage.getItem('theme');
    if(saved === 'light' || saved === 'dark') html.classList.add(saved);
    btn.addEventListener('click', () => {
      const isDark = html.classList.toggle('dark');
      html.classList.remove(isDark ? 'light' : 'dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      icon.textContent = isDark ? '🌙' : '🌞';
      btn.setAttribute('aria-pressed', String(isDark));
    });
    icon.textContent = html.classList.contains('dark') ? '🌙' : '🌞';
  })();
</script>

<!-- Netlify Identity -->
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      const authActions = document.getElementById('auth-actions');
      if (user) {
        authActions.innerHTML += `
          <a class="btn" href="/intranet/">Intranet</a>
          <button class="btn" onclick="window.netlifyIdentity.logout()">Logout</button>`;
      } else {
        authActions.innerHTML += `<a class="btn" href="/login">Login</a>`;
      }
    });
  }
</script>
