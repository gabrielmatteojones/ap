<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Bootstrap Italia CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-italia@1.6.2/dist/css/bootstrap-italia.min.css"
  />
  <!-- Firebase compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

  <style>
    body {
      background-color: #f8f9fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .login-box {
      background: white;
      padding: 2rem;
      border-radius: 0.5rem;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    #google-login, #apple-login {
      margin-top: 1rem;
    }
    .logo-container {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .logo-container img {
      max-height: 80px;
      width: auto;
    }
  </style>
</head>
<body>

  <main class="login-box">
    <div class="logo-container">
      <img src="https://gabrieljones.it/assets/logo.png" alt="Logo Gabriel Jones" />
    </div>

    <h1 class="text-center mb-4">Accedi</h1>

    <form id="login-form" autocomplete="off" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input
          type="email"
          class="form-control"
          id="email"
          placeholder="nome@esempio.it"
          required
          autofocus
        />
        <div class="invalid-feedback">Inserisci una email valida.</div>
      </div>

      <div class="mb-3" id="password-section">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          class="form-control"
          id="password"
          placeholder="********"
          required
        />
        <div class="invalid-feedback">Inserisci la password.</div>
      </div>

      <button type="submit" class="btn btn-primary w-100">Accedi</button>
    </form>

    <button
      id="google-login"
      class="btn btn-outline-primary w-100 mt-3 d-none"
      type="button"
    >
      Accedi con Google
    </button>

    <button
      id="apple-login"
      class="btn btn-outline-secondary w-100 mt-3"
      type="button"
    >
      Accedi con Apple
    </button>

    <div
      id="status"
      role="alert"
      class="mt-3 text-center fw-bold text-danger"
      aria-live="polite"
    ></div>
  </main>

  <script>
    // Config Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyA5vs7wXPz3gQlALVRjxJgFYwZmB-ySUGE",
      authDomain: "accentocivico.firebaseapp.com",
      projectId: "accentocivico",
      storageBucket: "accentocivico.firebasestorage.app",
      messagingSenderId: "458977448648",
      appId: "1:458977448648:web:cb08ac1274328356d5cbfd",
      measurementId: "G-HDMW0Y4M6Q",
    };
    firebase.initializeApp(firebaseConfig);

    const form = document.getElementById("login-form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const passwordSection = document.getElementById("password-section");
    const googleBtn = document.getElementById("google-login");
    const appleBtn = document.getElementById("apple-login");
    const status = document.getElementById("status");

    const dominiGoogle = ["agfo.fvg.it", "18f.it"];

    // Abilita persistenza locale per mantenere il login dopo refresh/chiusura
    firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(error => {
      console.error("Errore persistenza:", error);
    });

    // Se utente già loggato, lo mando subito all'area personale
    firebase.auth().onAuthStateChanged(user => {
      if (user) {
        redirectAfterLogin();
      }
    });

    // Mostra Google login solo per email aziendali
    emailInput.addEventListener("input", () => {
      const domain = emailInput.value.split("@")[1] || "";
      if (dominiGoogle.includes(domain.toLowerCase())) {
        passwordSection.classList.add("d-none");
        passwordInput.required = false;
        googleBtn.classList.remove("d-none");
      } else {
        passwordSection.classList.remove("d-none");
        passwordInput.required = true;
        googleBtn.classList.add("d-none");
      }
      status.textContent = "";
    });

    function redirectAfterLogin() {
      window.location.href = "/user/dashboard/";
    }

    // Login email/password
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!form.checkValidity()) {
        form.classList.add("was-validated");
        return;
      }

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      try {
        await firebase.auth().signInWithEmailAndPassword(email, password);
        status.classList.remove("text-danger");
        status.classList.add("text-success");
        status.textContent = "Accesso effettuato. Reindirizzamento...";
        setTimeout(redirectAfterLogin, 1000);
      } catch (error) {
        status.classList.remove("text-success");
        status.classList.add("text-danger");
        switch (error.code) {
          case "auth/user-not-found":
            status.textContent = "Utente non trovato.";
            break;
          case "auth/wrong-password":
            status.textContent = "Password errata.";
            break;
          case "auth/invalid-email":
            status.textContent = "Email non valida.";
            break;
          default:
            status.textContent = "Errore: " + error.message;
        }
      }
    });

    // Login Google
    googleBtn.addEventListener("click", async () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        const result = await firebase.auth().signInWithPopup(provider);
        const user = result.user;
        const domain = user.email.split("@")[1].toLowerCase();
        if (!dominiGoogle.includes(domain)) {
          await firebase.auth().signOut();
          status.classList.remove("text-success");
          status.classList.add("text-danger");
          status.textContent = "Accesso Google non autorizzato per questo dominio.";
          return;
        }
        status.classList.remove("text-danger");
        status.classList.add("text-success");
        status.textContent = "Accesso con Google riuscito. Reindirizzamento...";
        setTimeout(redirectAfterLogin, 1000);
      } catch (error) {
        status.classList.remove("text-success");
        status.classList.add("text-danger");
        status.textContent = "Errore: " + error.message;
      }
    });

    // Login Apple
    appleBtn.addEventListener("click", async () => {
      const provider = new firebase.auth.OAuthProvider('apple.com');
      try {
        const result = await firebase.auth().signInWithPopup(provider);
        // Apple non ha restrizioni di dominio qui
        status.classList.remove("text-danger");
        status.classList.add("text-success");
        status.textContent = "Accesso con Apple riuscito. Reindirizzamento...";
        setTimeout(redirectAfterLogin, 1000);
      } catch (error) {
        status.classList.remove("text-success");
        status.classList.add("text-danger");
        status.textContent = "Errore: " + error.message;
      }
    });
  </script>

  <!-- Bootstrap Italia JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap-italia@1.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
