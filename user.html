<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body class="bg-light d-flex align-items-center" style="height:100vh;">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4 bg-white p-4 rounded shadow-sm">

      <div class="text-center mb-4">
        <img src="https://gabrieljones.it/assets/logo.png" alt="Logo Gabriel Jones" style="max-height: 80px;" />
      </div>

      <h2 class="mb-3 text-center">Accedi al sistema</h2>

      <form id="loginForm" autocomplete="off" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" class="form-control" required autocomplete="username" />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control" required autocomplete="current-password" />
        </div>

        <button type="submit" class="btn btn-primary w-100">Accedi</button>
      </form>

      <div class="mt-3 text-center">
        <button id="btnGoogle" class="btn btn-outline-danger w-100 mb-2">Accedi con Google</button>
        <button id="btnApple" class="btn btn-outline-dark w-100">Accedi con Apple</button>
      </div>

      <div id="errorMsg" class="text-danger mt-3 text-center"></div>
    </div>
  </div>
</div>

<script>
  // Config Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyA5vs7wXPz3gQlALVRjxJgFYwZmB-ySUGE",
    authDomain: "accentocivico.firebaseapp.com",
    projectId: "accentocivico",
    storageBucket: "accentocivico.firebasestorage.app",
    messagingSenderId: "458977448648",
    appId: "1:458977448648:web:cb08ac1274328356d5cbfd",
    measurementId: "G-HDMW0Y4M6Q"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  // Login form email+password
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const email = e.target.email.value.trim();
    const password = e.target.password.value;
    const errorDiv = document.getElementById('errorMsg');
    errorDiv.textContent = '';

    try {
      await auth.signInWithEmailAndPassword(email, password);
      // Redirect dopo login
      window.location.href = '/user/dashboard/';
    } catch (err) {
      errorDiv.textContent = err.message;
    }
  });

  // Login Google (solo con dominio agfo.fvg.it o 18f.it)
  document.getElementById('btnGoogle').addEventListener('click', async () => {
    const provider = new firebase.auth.GoogleAuthProvider();
    try {
      const result = await auth.signInWithPopup(provider);
      const email = result.user.email || '';
      if (!email.endsWith('@agfo.fvg.it') && !email.endsWith('@18f.it')) {
        await auth.signOut();
        alert('Accesso Google consentito solo per account agfo.fvg.it o 18f.it');
        return;
      }
      window.location.href = '/user/dashboard/';
    } catch (err) {
      alert(err.message);
    }
  });

  // Login Apple (consente tutte le email)
  document.getElementById('btnApple').addEventListener('click', async () => {
    const provider = new firebase.auth.OAuthProvider('apple.com');
    try {
      await auth.signInWithPopup(provider);
      window.location.href = '/user/dashboard/';
    } catch (err) {
      alert(err.message);
    }
  });

</script>
</body>
</html>
