<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Accedi</title>
  <script src="https://www.gstatic.com/firebasejs/10.5.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.5.2/firebase-auth.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA5vs7wXPz3gQlALVRjxJgFYwZmB-ySUGE",
      authDomain: "accentocivico.firebaseapp.com",
      projectId: "accentocivico",
      storageBucket: "accentocivico.firebasestorage.app",
      messagingSenderId: "458977448648",
      appId: "1:458977448648:web:cb08ac1274328356d5cbfd",
      measurementId: "G-HDMW0Y4M6Q"
    };
    firebase.initializeApp(firebaseConfig);
  </script>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: auto; padding: 2rem; background: #f8f8f8; }
    input, button { width: 100%; margin: 0.5rem 0; padding: 0.75rem; }
    label { font-weight: bold; }
    .hidden { display: none; }
    .error { color: red; }
    .success { color: green; }
  </style>
</head>
<body>

  <h1>Accedi</h1>

  <form id="login-form">
    <label for="email">Email</label>
    <input type="email" id="email" required placeholder="nome@esempio.it">

    <div id="password-section">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="********">
    </div>

    <button type="submit">Accedi</button>
  </form>

  <button id="google-login" class="hidden">Accedi con Google</button>

  <p id="status" class="error"></p>

  <script>
    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordSection = document.getElementById('password-section');
    const googleBtn = document.getElementById('google-login');
    const status = document.getElementById('status');

    const dominiGoogle = ['agfo.fvg.it', '18f.it'];

    emailInput.addEventListener('input', () => {
      const domain = emailInput.value.split('@')[1] || '';
      const usaGoogle = dominiGoogle.includes(domain.toLowerCase());

      if (usaGoogle) {
        passwordSection.classList.add('hidden');
        googleBtn.classList.remove('hidden');
      } else {
        passwordSection.classList.remove('hidden');
        googleBtn.classList.add('hidden');
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      const password = document.getElementById('password').value;

      try {
        await firebase.auth().signInWithEmailAndPassword(email, password);
        status.className = "success";
        status.textContent = "Accesso riuscito. Reindirizzamento...";
        setTimeout(() => {
          window.location.href = "/";
        }, 1000);
      } catch (error) {
        status.className = "error";
        status.textContent = "Errore: " + error.message;
      }
    });

    googleBtn.addEventListener('click', async () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        await firebase.auth().signInWithPopup(provider);
        status.className = "success";
        status.textContent = "Accesso con Google riuscito.";
        setTimeout(() => {
          window.location.href = "/";
        }, 1000);
      } catch (error) {
        status.className = "error";
        status.textContent = "Errore: " + error.message;
      }
    });
  </script>

</body>
</html>
