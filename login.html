<div class="login-shell">
  <div class="login-head">
    <h1>Accedi</h1>
    <p class="muted">Scegli il metodo di accesso</p>
  </div>

  <div id="login-error" class="alert" role="alert" style="display:none;"></div>

  <div class="provider-grid">
    <!-- ACSL / Firebase -->
    <button id="btn-acsl" class="provider-card acsl" aria-label="Accedi con ACSL">
      <div class="icon">🔑</div>
      <div class="txt">
        <strong>ACSL</strong>
        <span class="muted">AccentoCivicoServiceSecuritySystemLogin</span>
      </div>
    </button>

    <!-- Netlify Identity -->
    <button id="btn-netlify" class="provider-card netlify" aria-label="Accedi con Netlify">
      <div class="icon">🌐</div>
      <div class="txt">
        <strong>Netlify</strong>
        <span class="muted">Identity Widget</span>
      </div>
    </button>
  </div>

  <p class="help muted">
    Problemi? Verifica di aver abilitato il provider e il dominio autorizzato.
  </p>
</div>

<!-- Netlify Identity -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

<!-- Firebase (ACSL) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAnalytics, isSupported as analyticsSupported } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-analytics.js";
  import {
    getAuth,
    setPersistence,
    browserLocalPersistence,
    onAuthStateChanged,
    signInWithPopup,
    signInWithRedirect,
    getRedirectResult,
    GoogleAuthProvider
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  // --- Config che mi hai dato ---
  const firebaseConfig = {
    apiKey: "AIzaSyDET0ys2c41Lwl1WklVD2dlT9IsQFbgbns",
    authDomain: "gabrielmatteojoneslogin.firebaseapp.com",
    projectId: "gabrielmatteojoneslogin",
    storageBucket: "gabrielmatteojoneslogin.firebasestorage.app",
    messagingSenderId: "842558884649",
    appId: "1:842558884649:web:f3a895cd546f8165d30538",
    measurementId: "G-VNEYX22DX9"
  };

  // --- Init Firebase + Analytics (solo se supportati) ---
  const app = initializeApp(firebaseConfig);
  try {
    if (await analyticsSupported()) getAnalytics(app);
  } catch(e) {
    // ignora errori analytics (ambiente non supportato)
    console.warn("Analytics non disponibili:", e?.message || e);
  }

  // --- Auth ---
  const auth = getAuth(app);
  await setPersistence(auth, browserLocalPersistence);
  const provider = new GoogleAuthProvider();

  // UI helpers
  const $err = document.getElementById("login-error");
  const showError = (msg) => {
    $err.textContent = msg;
    $err.style.display = "block";
  };
  const hideError = () => { $err.style.display = "none"; };

  // Se già loggato con ACSL, vai subito all'area personale
  onAuthStateChanged(auth, (user) => {
    if (user) window.location.href = "/area-personale/";
  });

  // Gestisci eventuale ritorno da signInWithRedirect
  try {
    const redirectRes = await getRedirectResult(auth);
    if (redirectRes?.user) {
      window.location.href = "/area-personale/";
    }
  } catch(e) {
    console.error(e);
  }

  // --- Login ACSL (Firebase) ---
  document.getElementById("btn-acsl").addEventListener("click", async () => {
    hideError();
    try {
      // tenta col popup
      await signInWithPopup(auth, provider);
      window.location.href = "/area-personale/";
    } catch (e) {
      console.warn("Popup fallito, provo redirect…", e?.code, e?.message);
      // Fallback: alcuni browser bloccano i popup
      try {
        await signInWithRedirect(auth, provider);
      } catch (err) {
        console.error("Errore login ACSL:", err);
        if (err?.code === "auth/unauthorized-domain") {
          showError("Dominio non autorizzato in Firebase Authentication. Aggiungi il dominio Netlify in Authentication → Settings → Authorized domains.");
        } else if (err?.code === "auth/operation-not-allowed") {
          showError("Provider Google non abilitato. Abilitalo in Authentication → Sign-in method.");
        } else {
          showError("Errore ACSL: " + (err?.message || "riprovare."));
        }
      }
    }
  });

  // --- Login Netlify Identity ---
  document.getElementById("btn-netlify").addEventListener("click", () => {
    const netlifyIdentity = window.netlifyIdentity;
    if (!netlifyIdentity) return showError("Netlify Identity non disponibile.");
    netlifyIdentity.open("login");
    netlifyIdentity.on("login", (user) => {
      window.location.href = "/intranet/";
    });
  });
</script>
