<div class="area-shell">
  <div class="card">
    <h1>Area Personale</h1>
    <p id="user-email" class="muted">Caricamento...</p>
    <button id="btn-logout" class="btn-logout">🚪 Esci</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDET0ys2c41Lwl1WklVD2dlT9IsQFbgbns",
    authDomain: "gabrielmatteojoneslogin.firebaseapp.com",
    projectId: "gabrielmatteojoneslogin",
    storageBucket: "gabrielmatteojoneslogin.firebasestorage.app",
    messagingSenderId: "842558884649",
    appId: "1:842558884649:web:f3a895cd546f8165d30538",
    measurementId: "G-VNEYX22DX9"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const userEmail = document.getElementById("user-email");

  // Controllo login
  onAuthStateChanged(auth, (user) => {
    if (user) {
      userEmail.textContent = "Benvenuto, " + user.email;
    } else {
      window.location.href = "/login/";
    }
  });

  // Logout
  document.getElementById("btn-logout").addEventListener("click", async () => {
    await signOut(auth);
    window.location.href = "/login/";
  });
</script>
