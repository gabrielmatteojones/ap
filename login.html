---
layout: default
title: "Login"
permalink: /login/
---

<div class="login-shell">
  <div class="login-head">
    <h1>Accedi</h1>
    <p class="muted">Scegli come autenticarti</p>
  </div>

  <div id="login-error" class="alert" role="alert" style="display:none;"></div>

  <!-- ACSL (Firebase: Email + Password) -->
  <form id="form-acsl" class="login-form">
    <h2>🔑 ACSL</h2>
    <label>Email</label>
    <input type="email" id="acsl-email" required placeholder="esempio@email.com">

    <label>Password</label>
    <input type="password" id="acsl-password" required placeholder="••••••••">

    <div class="form-actions">
      <button type="submit" class="btn-acsl">Accedi</button>
    </div>
  </form>

  <div class="divider">oppure</div>

  <!-- Netlify Identity -->
  <button id="btn-netlify" class="provider-card netlify" aria-label="Accedi con Netlify">
    <div class="icon">🌐</div>
    <div class="txt">
      <strong>Netlify</strong>
      <span class="muted">Identity Widget</span>
    </div>
  </button>
</div>

<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDET0ys2c41Lwl1WklVD2dlT9IsQFbgbns",
    authDomain: "gabrielmatteojoneslogin.firebaseapp.com",
    projectId: "gabrielmatteojoneslogin",
    storageBucket: "gabrielmatteojoneslogin.firebasestorage.app",
    messagingSenderId: "842558884649",
    appId: "1:842558884649:web:f3a895cd546f8165d30538",
    measurementId: "G-VNEYX22DX9"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  await setPersistence(auth, browserLocalPersistence);

  const $err = document.getElementById("login-error");
  const showError = (msg) => { $err.textContent = msg; $err.style.display = "block"; };
  const hideError = () => { $err.style.display = "none"; };

  // --- Login ACSL ---
  document.getElementById("form-acsl").addEventListener("submit", async (e) => {
    e.preventDefault();
    hideError();
    const email = document.getElementById("acsl-email").value;
    const pass = document.getElementById("acsl-password").value;

    try {
      await signInWithEmailAndPassword(auth, email, pass);
      window.location.href = "/area-personale/";
    } catch (err) {
      console.error("Errore login ACSL:", err);
      if (err.code === "auth/wrong-password") showError("Password errata.");
      else if (err.code === "auth/user-not-found") showError("Utente non trovato.");
      else if (err.code === "auth/invalid-email") showError("Email non valida.");
      else showError("Errore: " + (err.message || "riprovare."));
    }
  });

  // --- Login Netlify ---
  document.getElementById("btn-netlify").addEventListener("click", () => {
    const netlifyIdentity = window.netlifyIdentity;
    if (!netlifyIdentity) return showError("Netlify Identity non disponibile.");
    netlifyIdentity.open("login");
    netlifyIdentity.on("login", (user) => {
      window.location.href = "/intranet/";
    });
  });
</script>
