<div class="login-page">
  <div class="login-box">
    <h1>Accedi</h1>
    <p>Scegli il tuo metodo di accesso</p>

    <!-- Login Firebase / ACSL -->
    <button id="login-firebase" class="btn-acsl">
      🔑 Accedi con ACSL
    </button>

    <!-- Login Netlify Identity -->
    <button id="login-netlify" class="btn-netlify">
      🌐 Accedi con Netlify
    </button>
  </div>
</div>

<!-- Netlify Identity -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-analytics.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  // Config tuo Firebase (quello che mi hai passato)
  const firebaseConfig = {
    apiKey: "AIzaSyDET0ys2c41Lwl1WklVD2dlT9IsQFbgbns",
    authDomain: "gabrielmatteojoneslogin.firebaseapp.com",
    projectId: "gabrielmatteojoneslogin",
    storageBucket: "gabrielmatteojoneslogin.firebasestorage.app",
    messagingSenderId: "842558884649",
    appId: "1:842558884649:web:f3a895cd546f8165d30538",
    measurementId: "G-VNEYX22DX9"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  // --- Login ACSL (Firebase) ---
  document.getElementById("login-firebase").addEventListener("click", async () => {
    try {
      const result = await signInWithPopup(auth, provider);
      console.log("ACSL login OK:", result.user);
      // redirect alla tua area personale
      window.location.href = "/area-personale/";
    } catch (err) {
      console.error("Errore login ACSL:", err);
      alert("Errore login ACSL, riprova.");
    }
  });

  // --- Login Netlify Identity ---
  document.getElementById("login-netlify").addEventListener("click", () => {
    const netlifyIdentity = window.netlifyIdentity;
    if (!netlifyIdentity) return alert("Netlify Identity non disponibile.");
    
    netlifyIdentity.open("login");
    netlifyIdentity.on("login", user => {
      console.log("Netlify login ok:", user);
      window.location.href = "/intranet/";
    });
  });
</script>
