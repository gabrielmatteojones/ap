<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Generatore Documento PDF - AGFO</title>
  <style>
    body {
      font-family: Helvetica, Arial, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 0 25px;
      background: #f9f9f9;
      color: #222;
    }
    h1 {
      text-align: center;
      color: #004080;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 30px;
    }
    form label {
      display: block;
      margin: 15px 0 5px;
      font-weight: 600;
      text-transform: capitalize;
    }
    form input, form textarea {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: inherit;
      resize: vertical;
      box-sizing: border-box;
      transition: border-color 0.3s ease;
    }
    form input:focus, form textarea:focus {
      border-color: #004080;
      outline: none;
    }
    button {
      margin-top: 25px;
      padding: 14px 24px;
      font-size: 17px;
      background-color: #004080;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 6px;
      font-weight: 700;
      letter-spacing: 1px;
      transition: background-color 0.25s ease;
    }
    button:hover {
      background-color: #002a60;
    }
  </style>
</head>
<body>


  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    const { jsPDF } = window.jspdf;

    document.getElementById('docForm').addEventListener('submit', (e) => {
      e.preventDefault();

      const nome = document.getElementById('nome').value.trim();
      const cognome = document.getElementById('cognome').value.trim();
      const ufficio = document.getElementById('ufficio').value.trim();
      const email = document.getElementById('email').value.trim();
      const destinatario = document.getElementById('destinatario').value.trim();
      const corpo = document.getElementById('corpo').value.trim();

      const doc = new jsPDF({
        unit: "pt",
        format: "a4",
      });

      const pageWidth = doc.internal.pageSize.width;
      const pageHeight = doc.internal.pageSize.height;

      const marginLeft = 40;
      const marginRight = 40;
      const marginTop = 40;
      const marginBottom = 60;

      const maxWidth = pageWidth - marginLeft - marginRight;

      // Funzione per aggiungere intestazione e info mittente/destinatario su ogni pagina
      const addHeaderAndInfo = (doc) => {
        doc.setFont("helvetica", "bold");
        doc.setFontSize(20);
        doc.setTextColor("#004080");
        doc.text("Arena Giovani", marginLeft, marginTop + 50);

        doc.setFont("helvetica", "normal");
        doc.setFontSize(14);
        doc.setTextColor("#004080");
        doc.text("Friuli Occidentale", marginLeft, marginTop + 70);

        doc.setFontSize(11);
        doc.setTextColor("#666");
        doc.text("www.agfo.fvg.it", marginLeft, marginTop + 90);

        // linea sotto intestazione
        doc.setDrawColor("#004080");
        doc.setLineWidth(0.35);
        doc.line(marginLeft, marginTop + 100, pageWidth - marginRight, marginTop + 100);

        const infoStartY = marginTop + 120;
        doc.setFontSize(12);
        doc.setTextColor("#222");

        doc.text(`Mittente: ${nome} ${cognome}`, marginLeft, infoStartY);
        doc.text(`Ufficio: ${ufficio}`, marginLeft, infoStartY + 18);
        doc.text(`Email: ${email}`, marginLeft, infoStartY + 36);

        doc.text(`Destinatario: ${destinatario}`, marginLeft, infoStartY + 70);

        return infoStartY + 95; // ritorna Y di partenza per corpo testo
      };

      // Funzione per disegnare il footer su ogni pagina
      const drawFooter = (doc) => {
        const footerY = pageHeight - 40;
        doc.setFontSize(12);
        doc.setTextColor("#222");
        doc.text(`Data: ${new Date().toLocaleDateString()}`, pageWidth - marginRight - 140, footerY);

        doc.text("Firma:", pageWidth - marginRight - 140, footerY + 25);
        doc.setLineWidth(0.8);
        doc.line(pageWidth - marginRight - 90, footerY + 30, pageWidth - marginRight, footerY + 30);
      };

      // Funzione che gestisce la scrittura del corpo con salto pagina automatico
      const drawBodyText = (doc, text, startY) => {
        doc.setFontSize(12);
        doc.setTextColor("#004080");
        doc.text("Testo:", marginLeft, startY);

        doc.setFontSize(11);
        doc.setTextColor("#222");

        let cursorY = startY + 18;
        const lineHeight = 14;

        // Divido testo in paragrafi
        const paragraphs = text.split(/\n+/);

        paragraphs.forEach(paragraph => {
          const lines = doc.splitTextToSize(paragraph, maxWidth);
          for (let i = 0; i < lines.length; i++) {
            if (cursorY + lineHeight > pageHeight - marginBottom) {
              doc.addPage();
              addHeaderAndInfo(doc);
              drawFooter(doc);
              cursorY = marginTop + 220; // y per iniziare corpo testo pagina nuova (aggiustato)
              // Titolo testo sulla nuova pagina
              doc.setFontSize(12);
              doc.setTextColor("#004080");
              doc.text("Testo (continua):", marginLeft, cursorY - 15);

              doc.setFontSize(11);
              doc.setTextColor("#222");
            }
            doc.text(lines[i], marginLeft, cursorY);
            cursorY += lineHeight;
          }
          cursorY += 10; // spazio tra paragrafi
        });

        return cursorY;
      };

      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        // ridimensiona il logo
        const maxHeight = 50;
        let scale = maxHeight / img.height;
        let logoWidth = img.width * scale;
        let logoHeight = maxHeight;

        const canvas = document.createElement('canvas');
        canvas.width = logoWidth;
        canvas.height = logoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, logoWidth, logoHeight);
        const imgData = canvas.toDataURL('image/png');

        doc.addImage(imgData, 'PNG', marginLeft, marginTop, logoWidth, logoHeight);

        // testo intestazione affianco logo, centrato verticalmente
        const headerX = marginLeft + logoWidth + 15;
        const headerCenterY = marginTop + logoHeight / 2;

        doc.setFont("helvetica", "bold");
        doc.setFontSize(20);
        doc.setTextColor("#004080");
        doc.text("Arena Giovani", headerX, headerCenterY - 10);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(14);
        doc.text("Friuli Occidentale", headerX, headerCenterY + 10);
        doc.setFontSize(11);
        doc.setTextColor("#666");
        doc.text("www.agfo.fvg.it", headerX, headerCenterY + 25);

        // linea sotto intestazione
        doc.setDrawColor("#004080");
        doc.setLineWidth(0.35);
        doc.line(marginLeft, marginTop + logoHeight + 20, pageWidth - marginRight, marginTop + logoHeight + 20);

        const startY = marginTop + logoHeight + 40;

        // Dati mittente e destinatario
        doc.setFontSize(12);
        doc.setTextColor("#222");
        doc.text(`Mittente: ${nome} ${cognome}`, marginLeft, startY);
        doc.text(`Ufficio: ${ufficio}`, marginLeft, startY + 18);
        doc.text(`Email: ${email}`, marginLeft, startY + 36);
        doc.text(`Destinatario: ${destinatario}`, marginLeft, startY + 60);

        // Corpo del documento con salto pagina
        const afterBodyY = drawBodyText(doc, corpo, startY + 90);

        // Footer
        drawFooter(doc);

        // Salvataggio
        const filename = `Documento_${nome}_${cognome}.pdf`;
        doc.save(filename);
      };
      img.onerror = () => {
        // Se fallisce il caricamento logo, genera senza logo
        doc.setFont("helvetica", "bold");
        doc.setFontSize(20);
        doc.setTextColor("#004080");
        doc.text("Arena Giovani", marginLeft, marginTop + 50);

        doc.setFont("helvetica", "normal");
        doc.setFontSize(14);
        doc.text("Friuli Occidentale", marginLeft, marginTop + 70);

        doc.setFontSize(11);
        doc.setTextColor("#666");
        doc.text("www.agfo.fvg.it", marginLeft, marginTop + 90);

        doc.setDrawColor("#004080");
        doc.setLineWidth(0.35);
        doc.line(marginLeft, marginTop + 100, pageWidth - marginRight, marginTop + 100);

        const startY = marginTop + 120;

        doc.setFontSize(12);
        doc.setTextColor("#222");
        doc.text(`Mittente: ${nome} ${cognome}`, marginLeft, startY);
        doc.text(`Ufficio: ${ufficio}`, marginLeft, startY + 18);
        doc.text(`Email: ${email}`, marginLeft, startY + 36);
        doc.text(`Destinatario: ${destinatario}`, marginLeft, startY + 60);

        const afterBodyY = drawBodyText(doc, corpo, startY + 90);

        drawFooter(doc);

        const filename = `Documento_${nome}_${cognome}.pdf`;
        doc.save(filename);
      };

      img.src = "https://gabrieljones.it/assets/logo.png";
    });
  </script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

<style>
  /* Nascondo tutto finché non si verifica l’utente */
  #private-content {
    display: none;
    padding: 2rem;
  }
</style>

<div id="private-content" class="container">

  <h1>Genera Documento PDF - AGFO</h1>

  <form id="docForm">
    <label for="nome">Nome</label>
    <input type="text" id="nome" name="nome" required />

    <label for="cognome">Cognome</label>
    <input type="text" id="cognome" name="cognome" required />

    <label for="ufficio">Ufficio</label>
    <input type="text" id="ufficio" name="ufficio" required />

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required />

    <label for="destinatario">Destinatario</label>
    <input type="text" id="destinatario" name="destinatario" required />

    <label for="corpo">Corpo del documento</label>
    <textarea id="corpo" name="corpo" rows="7" required placeholder="Puoi usare invii a capo per nuove righe"></textarea>

    <button type="submit">Genera PDF</button>
  </form>
  
  <button class="btn btn-outline-danger mt-3" onclick="logout()">Logout</button>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCu9YBjutCK0UR3EoliYwiNrrKaY8cyt8U",
    authDomain: "ufficiogabrieljones.firebaseapp.com",
    projectId: "ufficiogabrieljones",
    storageBucket: "ufficiogabrieljones.firebasestorage.app",
    messagingSenderId: "754177287030",
    appId: "1:754177287030:web:e4f70d2d3d9c54c1d91057",
    measurementId: "G-HBSRVKC0JQ"
  };
  firebase.initializeApp(firebaseConfig);

  // Verifica lo stato di autenticazione
  firebase.auth().onAuthStateChanged(user => {
    if (user) {
      // Utente autenticato, mostra contenuto
      document.getElementById('private-content').style.display = 'block';
    } else {
      // Utente non autenticato, reindirizza al login
      window.location.href = '/user.html';  // Cambia con il percorso corretto
    }
  });

  function logout() {
    firebase.auth().signOut().then(() => {
      window.location.href = '/login.html';  // Cambia con il percorso corretto
    });
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
