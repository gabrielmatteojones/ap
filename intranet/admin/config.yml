backend:
  name: git-gateway
  branch: "48891"

media_folder: "assets/uploads"   # dove si salvano i file caricati
public_folder: "/assets/uploads"

collections:

  # --- POST ---
  - name: "posts"
    label: "Post"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime" }
      - { label: "Categoria", name: "categories", widget: "list", default: ["general"] }
      - { label: "Tag", name: "tags", widget: "list", required: false }
      - { label: "Immagine di copertina", name: "image", widget: "image", required: false }
      - { label: "Contenuto", name: "body", widget: "markdown" }

  # --- PAGINE ---
  - name: "pages"
    label: "Pagine"
    folder: "_pages"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Layout", name: "layout", widget: "string", default: "page" }
      - { label: "Contenuto", name: "body", widget: "markdown" }

  # --- VIDEO ---
  - name: "videos"
    label: "Video"
    folder: "_videos"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "URL Instagram", name: "url", widget: "string" }
      - { label: "Thumbnail (opzionale)", name: "thumb", widget: "image", required: false }
